name: TapeLoop
options:
  bundleIdPrefix: com.tapeloop
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  TapeLoop:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TapeLoop
        excludes:
          - Info.plist
    info:
      path: TapeLoop/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tapeloop.audiobuffer
        PRODUCT_NAME: TapeLoop
        INFOPLIST_FILE: TapeLoop/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
